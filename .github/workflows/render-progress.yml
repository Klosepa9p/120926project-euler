name: Render Euler Progress

on:
  repository_dispatch:
    types: [solved-update]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: solved.json'u dispatch payload'ından güncelle
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python - <<'PYEOF'
          import json
          import os

          payload = json.loads(os.environ["PAYLOAD"])
          data = {
              "solved": sorted(set(payload.get("solved", []))),
              "max_n": payload.get("max_n", 1010),
              "username": payload.get("username", ""),
          }
          os.makedirs("data", exist_ok=True)
          with open("data/solved.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          print("data/solved.json güncellendi:", data)
          PYEOF

      - name: SVG üret
        run: python scripts/render_svg.py

      - name: Değişiklik varsa commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/solved.json euler-progress.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: progress güncellendi"
            git push
          else
            echo "Değişiklik yok, commit atlanıyor."
          fi
